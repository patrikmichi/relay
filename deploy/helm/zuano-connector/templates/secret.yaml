{{- if and .Values.enrollment.token (not .Values.enrollment.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zuano-connector.tokenSecretName" . }}
  labels:
    {{- include "zuano-connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.enrollment.token | quote }}
{{- end }}
