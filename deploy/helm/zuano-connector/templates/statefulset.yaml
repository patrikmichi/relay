{{- $url := required "enrollment.url is required: the gateway the pods enroll with" .Values.enrollment.url -}}
{{- if not (or .Values.enrollment.token .Values.enrollment.existingSecret) }}
{{- fail "set enrollment.token, or enrollment.existingSecret naming a Secret that holds it" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zuano-connector.fullname" . }}
  labels:
    {{- include "zuano-connector.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "zuano-connector.fullname" . }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "zuano-connector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zuano-connector.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.metrics.scrape }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "zuano-connector.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .Values.antiAffinity "hard" }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "zuano-connector.selectorLabels" . | nindent 18 }}
      {{- else if eq .Values.antiAffinity "soft" }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "zuano-connector.selectorLabels" . | nindent 20 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: connector
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run", "--config", "/etc/zuano-connector/config.yaml"]
          env:
            - name: ZUANO_CONNECTOR_URL
              value: {{ $url | quote }}
            - name: ZUANO_CONNECTOR_ENROLL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "zuano-connector.tokenSecretName" . }}
                  key: {{ if .Values.enrollment.existingSecret }}{{ .Values.enrollment.existingSecretKey }}{{ else }}token{{ end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.metrics.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/zuano-connector
              readOnly: true
            - name: state
              mountPath: /var/lib/zuano-connector
            - name: tmp
              mountPath: /tmp
            {{- range .Values.secretMounts }}
            - name: secret-{{ .name }}
              mountPath: /run/secrets/{{ .name }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "zuano-connector.fullname" . }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        {{- range .Values.secretMounts }}
        - name: secret-{{ .name }}
          secret:
            secretName: {{ .secretName }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
