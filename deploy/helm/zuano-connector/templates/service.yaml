apiVersion: v1
kind: Service
metadata:
  name: {{ include "zuano-connector.fullname" . }}
  labels:
    {{- include "zuano-connector.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "zuano-connector.selectorLabels" . | nindent 4 }}
  ports:
    - name: health
      port: {{ .Values.metrics.port }}
      targetPort: health
