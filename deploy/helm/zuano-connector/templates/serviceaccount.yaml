{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zuano-connector.serviceAccountName" . }}
  labels:
    {{- include "zuano-connector.labels" . | nindent 4 }}
# The pod talks to no Kubernetes API, so it gets no token.
automountServiceAccountToken: false
{{- end }}
