# Repository secrets:
#   HOSTNAME_DENYLIST       hostnames that must never appear in a release binary
#                           (newline- or comma-separated)
#   PACKAGING_GITHUB_TOKEN  fine-grained PAT with contents:write on
#                           patrikmichi/homebrew-tap and patrikmichi/scoop-bucket
# macOS binaries are not codesigned or notarized.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"
  GOVULNCHECK_VERSION: "v1.8.0"
  GORELEASER_VERSION: "v2.18.2"
  MODULE: github.com/patrikmichi/relay

jobs:
  verify:
    name: verify tag source
    runs-on: ubuntu-latest
    env:
      HOSTNAME_DENYLIST: ${{ secrets.HOSTNAME_DENYLIST }}
      REQUIRE_HOSTNAME_DENYLIST: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Tag is a semver tag on main with the module source
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a semver tag (vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
          if ! grep -qx "module $MODULE" go.mod || [ ! -f cmd/relay/main.go ]; then
            echo "::error::$GITHUB_REF_NAME does not contain the $MODULE source"
            exit 1
          fi

      - name: Packaging token is configured
        env:
          PACKAGING_GITHUB_TOKEN: ${{ secrets.PACKAGING_GITHUB_TOKEN }}
        run: |
          if [ -z "$PACKAGING_GITHUB_TOKEN" ]; then
            echo "::error::set the PACKAGING_GITHUB_TOKEN repository secret before tagging"
            exit 1
          fi

      - name: Scan tracked files
        run: git ls-files -z | xargs -0 bash .github/scripts/scan-denylist.sh

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Test
        run: go test -race ./...

      - name: Vulnerability scan
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

      - name: go install from the tag
        working-directory: ${{ runner.temp }}
        env:
          GOPROXY: direct
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install "$MODULE/cmd/relay@$GITHUB_REF_NAME"
          "$GOBIN/relay" --version | tee version.txt
          grep -qF "$GITHUB_REF_NAME " version.txt
          bash "$GITHUB_WORKSPACE/.github/scripts/scan-denylist.sh" "$GOBIN/relay"

  release:
    name: goreleaser release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      HOSTNAME_DENYLIST: ${{ secrets.HOSTNAME_DENYLIST }}
      REQUIRE_HOSTNAME_DENYLIST: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Release notes
        id: notes
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            echo "args=--release-notes=$notes" >> "$GITHUB_OUTPUT"
          fi

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGING_GITHUB_TOKEN: ${{ secrets.PACKAGING_GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt
