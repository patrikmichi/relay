# Run from the standalone relay repository root.
version: 2

project_name: relay

release:
  github:
    owner: patrikmichi
    name: relay

before:
  hooks:
    - bash scripts/generate-completions.sh

builds:
  - id: relay
    main: ./cmd/relay
    binary: relay
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # Missing optional gateway defaults resolve to an empty string.
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }} -X github.com/patrikmichi/relay/internal/config.DefaultGatewayURL={{ index .Env "RELAY_DEFAULT_GATEWAY_URL" }}

archives:
  - id: relay
    ids:
      - relay
    formats:
      - tar.gz
    name_template: "relay_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - completions/*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]-]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]-]+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999

snapshot:
  version_template: "{{ .Version }}-next+{{ .ShortCommit }}"

# Retain formula support for Linux and macOS with GoReleaser 2.16.
brews:
  - name: relay
    ids:
      - relay
    repository:
      owner: patrikmichi
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}'
    commit_author:
      name: patrikmichi
      email: yay@patrikmichalicka.com
    homepage: "https://github.com/patrikmichi/relay"
    description: "relay — unified CLI client for the Atlas gateway (multi-service integration hub)."
    install: |
      bin.install "relay"
      generate_completions_from_executable(bin/"relay", "completion")
    test: |
      system "#{bin}/relay", "--version"
    skip_upload: auto
