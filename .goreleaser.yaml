# Release config for the relay CLI (goreleaser v2). Builds only from the tagged
# source with no gateway hostname: users point relay at a gateway at runtime
# via `relay config set-gateway` or GATEWAY_URL.
version: 2

project_name: relay

release:
  github:
    owner: patrikmichi
    name: relay
  prerelease: auto

before:
  hooks:
    - bash scripts/generate-completions.sh

builds:
  - id: relay
    main: ./cmd/relay
    binary: relay
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .CommitDate }}
    hooks:
      post:
        - cmd: bash .github/scripts/scan-denylist.sh "{{ .Path }}"
          output: true

archives:
  - id: relay
    ids:
      - relay
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Same asset names as v0.1.0 so the Scoop autoupdate URLs keep resolving.
    name_template: "relay-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - completions/*

checksum:
  name_template: "SHA256SUMS.txt"
  algorithm: sha256

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

sboms:
  - artifacts: archive

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]-]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]-]+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999

snapshot:
  version_template: "{{ incpatch .Version }}-next+{{ .ShortCommit }}"

brews:
  - name: relay
    ids:
      - relay
    repository:
      owner: patrikmichi
      name: homebrew-tap
      token: '{{ index .Env "PACKAGING_GITHUB_TOKEN" }}'
    directory: Formula
    commit_author:
      name: patrikmichi
      email: yay@patrikmichalicka.com
    commit_msg_template: "relay {{ .Tag }}"
    homepage: "https://github.com/patrikmichi/relay"
    description: "Manage AI agent skills and agents across providers"
    license: "Apache-2.0"
    install: |
      bin.install "relay"
      generate_completions_from_executable(bin/"relay", "completion")
    test: |
      system "#{bin}/relay", "--version"
    skip_upload: auto

scoops:
  - name: relay
    ids:
      - relay
    repository:
      owner: patrikmichi
      name: scoop-bucket
      token: '{{ index .Env "PACKAGING_GITHUB_TOKEN" }}'
    directory: bucket
    commit_author:
      name: patrikmichi
      email: yay@patrikmichalicka.com
    commit_msg_template: "relay {{ .Tag }}"
    homepage: "https://github.com/patrikmichi/relay"
    description: "Manage AI agent skills and agents across providers"
    license: "Apache-2.0"
    skip_upload: auto
