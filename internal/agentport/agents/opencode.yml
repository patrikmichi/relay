# opencode agent provider config — Agent IR, not Skill IR. Per opencode's
# own documentation (https://opencode.ai/docs/agents/, "Markdown" config
# section), a markdown-defined opencode agent is a flat `<name>.md` —
# frontmatter + markdown body — at ~/.config/opencode/agents/<name>.md
# (user, PLURAL "agents") or .opencode/agents/<name>.md (project). An
# earlier config used the singular "agent" directory for both scopes, which
# does not match the documented root, so Relay could not discover or
# install into a real opencode agent directory. The singular root is kept
# below as an explicit READ-only compat fallback (role: compat) for any
# pre-existing install under the old path — it is never a write or
# rollback target (see ownDirCount/DirRoleCompat in config.go).
#
# Fields: description, mode (primary|subagent|all), model
# ("provider/model" string), temperature, tools. NOT mapped here
# (deliberately deferred):
#   - `name` — opencode agent files have no name field on disk; the
#     first-class layout: flat Load path (config_adapter.go) already infers
#     it from the filename when frontmatter omits it, exactly as needed.
#   - `permission` — no Agent IR field; opencode-only, partially
#     representable, not yet supported.
#
# `tools` is declared here with the canonical Agent IR type
# (string-or-list, matching agent_ir_fields.go's fixed descriptor — the
# config validator requires this) even though opencode's ON-DISK shape is a
# {tool: bool} MAP, not a list: agentConfigAdapter.Load/Project special-case
# ir=="tools" && ID()==opencode to reshape via toolsMapToList/
# toolsListToMap (agent_caps.go) instead of the generic flexStringList
# codec — the same pattern Model uses (declared type "string", reshaped
# through modelLossForTarget's alias table). toolsLossForTarget reports the
# resulting LossDegraded.
id: opencode
layout: flat
discovery: direct

dirs:
  user:
    - { path: "~/.config/opencode/agents", role: own } # dirs[0] = writable_primary
    - { path: "~/.config/opencode/agent", role: compat } # pre-1.0 singular root, read-only
  project:
    - { path: ".opencode/agents", role: own }
    - { path: ".opencode/agent", role: compat } # pre-1.0 singular root, read-only

frontmatter:
  - { ir: description, key: description, type: string, presence: required }
  - { ir: mode, key: mode, type: string, presence: optional }
  - { ir: model, key: model, type: string, presence: optional }
  - { ir: temperature, key: temperature, type: float, presence: optional }
  - { ir: tools, key: tools, type: string-or-list, presence: optional }

# Agent CapSet/capabilities are Go-code tables (agent_caps.go), not a
# YAML-driven list like skills' `capabilities:` — deliberately left unset
# here.
