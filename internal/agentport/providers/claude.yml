id: claude
skill_file: SKILL.md
resource_dirs: [scripts, references, assets]
discovery: direct

dirs:
  user:
    - { path: "~/.claude/skills", role: own }
    - { path: "~/.claude/commands", role: own }
  project:
    - { path: ".claude/skills", role: own }
    - { path: ".claude/commands", role: own }

frontmatter:
  - { ir: name, key: name, type: string, presence: required }
  - { ir: description, key: description, type: string, presence: required }
  - { ir: allowed_tools, key: allowed-tools, type: string-or-list, presence: optional }
  - { ir: disable_model_invocation, key: disable-model-invocation, type: bool, presence: optional }
  - { ir: license, key: license, type: string, presence: optional }

capabilities: [AllowedTools, DisableModelInvocation, License]
load_hooks: [claude-legacy-commands]
