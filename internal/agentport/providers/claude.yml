# Claude Code provider config — replaces the shipped adapter_claude.go.
#
# Skill locations: user ~/.claude/skills/<name>/SKILL.md, project
# .claude/skills/<name>/SKILL.md. Also loads the legacy flat-command form
# (~/.claude/commands/<name>.md / .claude/commands/<name>.md) via the
# claude-legacy-commands load hook — a bare markdown file with the same
# frontmatter shape works as a "skill" with no resources.
id: claude
skill_file: SKILL.md
resource_dirs: [scripts, references, assets]
discovery: direct

dirs:
  user:
    - { path: "~/.claude/skills", role: own } # dirs[0] = writable_primary
    - { path: "~/.claude/commands", role: own } # legacy flat-command dir — genuinely Claude's own, not a compat read
  project:
    - { path: ".claude/skills", role: own }
    - { path: ".claude/commands", role: own }

frontmatter:
  - { ir: name, key: name, type: string, presence: required }
  - { ir: description, key: description, type: string, presence: required }
  - { ir: allowed_tools, key: allowed-tools, type: string-or-list, presence: optional }
  - { ir: disable_model_invocation, key: disable-model-invocation, type: bool, presence: optional }
  - { ir: license, key: license, type: string, presence: optional }

capabilities: [AllowedTools, DisableModelInvocation, License]
load_hooks: [claude-legacy-commands]
