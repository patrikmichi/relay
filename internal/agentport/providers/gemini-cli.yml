# Gemini CLI provider config — added YAML-ONLY, with NO Go change, to
# prove the config-driven refactor's central claim: a normal new platform
# is a data edit, not a recompile.
#
# Skill locations: user ~/.gemini/skills/<name>/SKILL.md (primary), project
# .gemini/skills/<name>/SKILL.md (primary); also reads the open
# Agent-Skills-standard compat paths .agents/skills / ~/.agents/skills.
# Frontmatter: name (must match dir name), description — the only two
# documented fields, both required.
#
# verified: 2026-09-05 against https://geminicli.com/docs/cli/creating-skills/
id: gemini-cli
skill_file: SKILL.md
resource_dirs: [scripts, references, assets]
discovery: direct

dirs:
  user:
    - { path: "~/.gemini/skills", role: own } # dirs[0] = writable_primary
    - { path: "~/.agents/skills", role: compat }
  project:
    - { path: ".gemini/skills", role: own }
    - { path: ".agents/skills", role: compat }

frontmatter:
  - { ir: name, key: name, type: string, presence: required }
  - { ir: description, key: description, type: string, presence: required }
  - { ir: metadata, key: metadata, type: map, presence: optional }

capabilities: [Metadata]
