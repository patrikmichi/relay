# Windsurf provider config — added YAML-ONLY, with NO Go change, to prove
# the config-driven refactor's central claim: a normal new platform is a
# data edit, not a recompile.
#
# R21: the user-scope root is verified against current Windsurf/Cascade
# documentation (https://docs.devin.ai/desktop/cascade/skills):
# ~/.codeium/windsurf/skills, not ~/.windsurf/skills. The old path is kept
# below as an explicit READ-only compat fallback (role: compat) for a
# pre-existing install — never a write or rollback target. The project
# path is a SEPARATE matter per the same documentation and is left
# unchanged (still best-effort/unverified — do not conflate it with the
# now-corrected user path).
id: windsurf
skill_file: SKILL.md
resource_dirs: [scripts, references, assets]
discovery: direct

dirs:
  user:
    - { path: "~/.codeium/windsurf/skills", role: own }
    - { path: "~/.windsurf/skills", role: compat } # R21: pre-correction root, read-only
  project:
    - { path: ".windsurf/skills", role: own }

frontmatter:
  - { ir: name, key: name, type: string, presence: required }
  - { ir: description, key: description, type: string, presence: required }
  - { ir: metadata, key: metadata, type: map, presence: optional }

capabilities: [Metadata]
