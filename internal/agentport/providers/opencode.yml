id: opencode
skill_file: SKILL.md
resource_dirs: [scripts, references, assets]
discovery: direct

dirs:
  user:
    - { path: "~/.config/opencode/skills", role: own }
    - { path: "~/.claude/skills", role: compat }
    - { path: "~/.agents/skills", role: compat }
  project:
    - { path: ".opencode/skills", role: own }
    - { path: ".claude/skills", role: compat }
    - { path: ".agents/skills", role: compat }

frontmatter:
  - { ir: name, key: name, type: string, presence: required }
  - { ir: description, key: description, type: string, presence: required }
  - { ir: license, key: license, type: string, presence: optional }
  - { ir: compatibility, key: compatibility, type: string, presence: optional }
  - { ir: metadata, key: metadata, type: map, presence: optional }

capabilities: [License, Compatibility, Metadata]
