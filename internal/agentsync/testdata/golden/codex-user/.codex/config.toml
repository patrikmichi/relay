model = "gpt-5"

[features]
hooks = true

# >>> relay-managed:begin mcp >>>
[mcp_servers.relay]
url = "https://gateway.example.com/api/mcp"
bearer_token_env_var = "ZUANO_API_KEY"

[mcp_servers.docs]
command = "npx"
args = ["-y", "@acme/docs-mcp"]

[mcp_servers.docs.env]
DOCS_REGION = "eu"
# <<< relay-managed:end mcp <<<

# >>> relay-managed:begin env >>>
[shell_environment_policy.set]
ZUANO_AGENT = "1"
# <<< relay-managed:end env <<<
